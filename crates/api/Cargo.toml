[package]
name = "synapse-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
synapse-domain = { path = "../domain" }
axum = "0.8"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate", "json"] }
serde.workspace = true
serde_json = "1"
chrono.workspace = true
uuid.workspace = true
utoipa.workspace = true
utoipa-axum = "0.2"
argon2 = "0.5"
sha2 = "0.10"
hex = "0.4"
dotenvy = "0.15"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "pool"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

