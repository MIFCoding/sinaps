name: synapse
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapse_local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - synapse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  synapse_pg:
